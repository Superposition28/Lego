# Global LEGO Operations Manifest
# Placeholders: Game_Root, Project_Root are built into the engine.
# Sub-game modules under `Games/*` (such as `Games/Lego_Harry_Potter/operations.toml`) are
# discovered and executed directly by the engine (e.g. `--game_module Lego_Harry_Potter`).

title = "Global LEGO Operations"

## Downloads the shared tools listed in Tools.toml
[[operation]]
id = -1
name = "Download Required Tools"
run-all = true
depends-on = []
script_type = "engine"
script = "download-tools"
tools_manifest = "{{Game_Root}}/Tools.toml"

